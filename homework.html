<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Colour Generator</title>

    <style>
        body {
            margin:0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
            font-family: Arial;
        }
        button {
            padding: 15px 25px;
            color:black;
            font-size: 18px;
            border: 1px solid black;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="btn" onclick="changeColor()"> Change Colour</button>

    <script>
        function changeColor() {
            let letters = "0123456789ABCDEF";
            let color = "#";

            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }

            document.body.style.backgroundColor = color;
            document.getElementById("btn").style.backgroundColor = color;
        }
    </script>
</body>
</html>
